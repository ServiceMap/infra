name: ${COMPOSE_PROJECT_NAME}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    
networks:
  servicemap-net:
    name: ${NETWORK_NAME}

volumes:
  postgres_data:
  redis_data:
  redis_insight_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

services:
  # TRAEFIK - Reverse Proxy
  traefik:
    image: traefik:v3.1
    container_name: servicemap-traefik
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
      - "8082:8082"
    volumes:
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/dynamic/:/etc/traefik/dynamic/:ro"
    networks:
      - ${NETWORK_NAME}
    logging: *default-logging

  # POSTGRES
  postgres:
    image: postgres:16
    container_name: servicemap-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - ${NETWORK_NAME}
    logging: *default-logging

  # KEYCLOAK
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: servicemap-keycloak
    restart: unless-stopped
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_PROXY=edge
      - KC_FEATURES=token-exchange
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/realm-export.json
    command:
      - "start-dev"
      - "--import-realm"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_started
    networks:
      - ${NETWORK_NAME}
    ports:
      - "8081:8080"
    logging: *default-logging

  # RABBITMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: servicemap-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ${NETWORK_NAME}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    logging: *default-logging

  # REDIS
  redis:
    image: redis:7.4
    container_name: servicemap-redis
    restart: on-failure
    command: ["redis-server", "--protected-mode", "no", "--port", "6379"]
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 100
    ports:
      - "6379:6379"
    networks:
      - ${NETWORK_NAME}
    volumes:
      - redis_data:/data
    logging: *default-logging
    
  # REDIS INSIGHT
  redis-insight:
    image: redis/redisinsight:latest
    container_name: servicemap-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    networks:
      - ${NETWORK_NAME}
    volumes:
      - redis_insight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    
  # REDIS INSIGHT CONFIGURATOR (runs once)
  redis-insight-init:
    image: curlimages/curl:latest
    container_name: servicemap-redis-insight-init
    networks:
      - ${NETWORK_NAME}
    depends_on:
      - redis-insight
    entrypoint: [ "/bin/sh", "-c" ]
    command:
    - |
      echo 'Waiting for RedisInsight to be ready...';
      for i in $$(seq 1 30); do
        if curl -s http://servicemap-redis-insight:5540 > /dev/null 2>&1; then
          echo 'RedisInsight is ready!';
          break;
        fi;
        echo "Waiting... ($$i/30)";
        sleep 2;
      done;
      sleep 5;
      echo 'Configuring Redis database...';
      curl -X POST http://servicemap-redis-insight:5540/api/databases \
        -H 'Content-Type: application/json' \
        -d '{"name":"ServiceMap Redis","host":"servicemap-redis","port":6379}' \
        && echo 'Database configured!' || echo 'Database might already exist';
    restart: "no"

  # MAILHOG
  mailhog:
    image: mailhog/mailhog
    container_name: servicemap-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - ${NETWORK_NAME}
    logging: *default-logging

  # GATEWAY (API)
  gateway:
    build:
      context: ../gateway
      dockerfile: docker/Dockerfile
    container_name: servicemap-gateway
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "8085:8085"
    networks:
      - ${NETWORK_NAME}
    logging: *default-logging

  # UI (React)
  ui:
    build:
      context: ../ui
      dockerfile: docker/Dockerfile
      platforms:
        - linux/arm64
    container_name: servicemap-ui
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://api.localhost
      - VITE_KEYCLOAK_URL=http://keycloak.localhost
    ports:
      - "5173:5173"
    networks:
      - ${NETWORK_NAME}
    depends_on:
      gateway:
        condition: service_started
    logging: *default-logging

  # PROMETHEUS
  prometheus:
    image: prom/prometheus:latest
    container_name: servicemap-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - ${NETWORK_NAME}
    logging: *default-logging

  # GRAFANA
  grafana:
    image: grafana/grafana:latest
    container_name: servicemap-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - ${NETWORK_NAME}
    logging: *default-logging
